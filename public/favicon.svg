<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Background -->
  <rect width="32" height="32" rx="8" fill="#17171B"/>

  <!-- Glows behind highlighted cells -->
  <ellipse cx="7.5"  cy="9.5"  rx="5.5" ry="6.5" fill="#5e6ad2" opacity="0.22"/>
  <ellipse cx="24.5" cy="9.5"  rx="5.5" ry="6.5" fill="#5e6ad2" opacity="0.22"/>
  <ellipse cx="16"   cy="22.5" rx="5.5" ry="6.5" fill="#5e6ad2" opacity="0.22"/>

  <!-- Row 1 -->
  <rect x="4"    y="4" width="7" height="11" rx="2" fill="#5e6ad2"/>  <!-- done -->
  <rect x="12.5" y="4" width="7" height="11" rx="2" fill="#2C2F36"/>
  <rect x="21"   y="4" width="7" height="11" rx="2" fill="#5e6ad2"/>  <!-- done -->

  <!-- Row 2 -->
  <rect x="4"    y="17" width="7" height="11" rx="2" fill="#2C2F36"/>
  <rect x="12.5" y="17" width="7" height="11" rx="2" fill="#5e6ad2"/> <!-- done -->
  <rect x="21"   y="17" width="7" height="11" rx="2" fill="#2C2F36"/>

  <!-- Checkmarks (row1-col1, row1-col3, row2-col2) -->
  <path d="M5.8 9.8 L7.2 11.3 L9.7 7.3"
        stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M22.8 9.8 L24.2 11.3 L26.7 7.3"
        stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M14.3 22.8 L15.7 24.3 L18.2 20.3"
        stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
